name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Unit tests never connect; the database tests run on Linux where a service container exists.
      TEST_DATABASE_URL: postgresql://mm_ai:ci_password_only@127.0.0.1:5432/mm_ai_test
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
    services:
      postgres:
        # Service containers are Linux-only; on Windows this block is ignored by the matrix guard below.
        image: ${{ matrix.os == 'ubuntu-latest' && 'pgvector/pgvector:pg17' || '' }}
        env:
          POSTGRES_USER: mm_ai
          POSTGRES_PASSWORD: ci_password_only
          POSTGRES_DB: mm_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mm_ai" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f53f5227a9e83886ab598c617f3c170fab62f0d3 # v6
        with:
          version: 10.34.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Quality gate with database tests (Linux)
        if: runner.os == 'Linux'
        run: |
          pnpm --filter @mm-ai/api exec prisma migrate deploy
          pnpm check:js
        env:
          DATABASE_URL: postgresql://mm_ai:ci_password_only@127.0.0.1:5432/mm_ai_test
      - name: Quality gate without database tests (Windows)
        if: runner.os == 'Windows'
        run: pnpm check:js:nodb

  python:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13.14'
      - name: Create virtual environment (Windows)
        if: runner.os == 'Windows'
        run: python -m venv .venv
      - name: Install and check (Windows)
        if: runner.os == 'Windows'
        run: |
          .\.venv\Scripts\python.exe -m pip install -r .\apps\ai-service\requirements.lock
          .\.venv\Scripts\python.exe -m pip install --no-deps -e .\apps\ai-service
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-python.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/audit-python.ps1
      - name: Create virtual environment (Linux)
        if: runner.os == 'Linux'
        run: python -m venv .venv
      - name: Install and check (Linux)
        if: runner.os == 'Linux'
        run: |
          ./.venv/bin/python -m pip install -r ./apps/ai-service/requirements.lock
          ./.venv/bin/python -m pip install --no-deps -e ./apps/ai-service
          bash scripts/check-python.sh
          bash scripts/audit-python.sh
